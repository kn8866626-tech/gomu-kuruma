<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>ゴムの くるま きろく</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:"Yu Gothic","Hiragino Sans",sans-serif;background:#FFFDF5;color:#2F3C7E;-webkit-user-select:none;user-select:none}
header{background:#2F3C7E;color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header h1{font-size:28px;margin:0;flex:1}header select,header input{font-size:22px;padding:6px 10px;border-radius:10px;border:none;max-width:210px}
main{display:flex;gap:16px;padding:14px;flex-wrap:wrap}
.left{flex:2;min-width:480px}.right{flex:1;min-width:300px}
table{width:100%;border-collapse:separate;border-spacing:8px}th{font-size:24px;color:#fff;border-radius:14px;padding:10px}
td{height:70px;background:#fff;border:4px solid #ccc;border-radius:16px;text-align:center;font-size:40px;font-weight:bold;cursor:pointer}
td.sel{border-color:#F9A826;background:#FFF4D6;box-shadow:0 0 0 4px #F9E795}td small{font-size:20px;color:#888}
.rowh{color:#fff;font-size:26px;font-weight:bold;border-radius:14px;padding:6px;text-align:center;width:150px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.pad button{font-size:44px;font-weight:bold;padding:14px 0;border-radius:18px;border:4px solid #2F3C7E;background:#fff;color:#2F3C7E}
.pad button:active{background:#F9E795}.pad .ok{background:#4C9F70;color:#fff;border-color:#4C9F70;font-size:26px;white-space:nowrap}.pad .del{background:#F96167;color:#fff;border-color:#F96167;font-size:34px}
#disp{font-size:34px;text-align:center;background:#fff;border:4px solid #2F3C7E;border-radius:18px;padding:6px;margin-bottom:10px;min-height:84px}
.btns{margin:10px 0;display:flex;gap:10px;flex-wrap:wrap}.btns button{font-size:26px;font-weight:bold;padding:14px 26px;border-radius:18px;border:none;color:#fff;background:#4EA8DE}
#graph{background:#fff;border:4px solid #4EA8DE;border-radius:18px;padding:14px;margin-top:8px}
.bar{height:44px;border-radius:10px;color:#fff;font-size:26px;font-weight:bold;line-height:44px;padding-left:12px;margin:6px 0;min-width:70px;white-space:nowrap;transition:width .6s}
#res{font-size:30px;font-weight:bold;text-align:center;margin:10px;color:#F96167}
.lbl{font-size:24px;font-weight:bold;margin-top:6px}
</style>
<header><h1>🚗 ゴムの くるま きろく</h1>
<select id="mode"><option value="3">3じかんめ（あか・きいろ・あお）</option><option value="4">4じかんめ（＋アイデア）</option></select>
<input id="name" placeholder="なまえ"></header>
<main><div class="left"><table id="tb"></table>
<div class="btns"><button onclick="show()">📊 くらべる</button><button style="background:#F4A340" onclick="clearAll()">🗑 ぜんぶ けす</button><button id="idea" style="background:#7B5EA7;display:none" onclick="rename()">💡 アイデアの なまえ</button></div>
<div id="res"></div><div id="graph"></div></div>
<div class="right"><div id="disp">　</div><div class="pad" id="pad"></div></div></main>
<script>
const $=id=>document.getElementById(id);let sel=null,buf='';
let st=JSON.parse(localStorage.getItem('gomukuruma')||'null')||{v:{},idea:'アイデア'};
function save(){try{localStorage.setItem('gomukuruma',JSON.stringify(st))}catch(e){}}
function key(n){return ($('name').value||'')+'|'+$('mode').value+'|'+n}
function conds(){const c=[['あか','#E8483B'],['きいろ','#E0A800'],['あお','#2F80ED']];if($('mode').value==='4')c.push([st.idea,'#7B5EA7']);return c}
function draw(){const c=conds();$('idea').style.display=$('mode').value==='4'?'':'none';let h='<tr><th></th>'+[1,2].map(i=>`<th style="background:#2F3C7E">${i}かいめ</th>`).join('')+'</tr>';
c.forEach((x,r)=>{h+=`<tr><td class="rowh" style="background:${x[1]};cursor:default">${x[0]}</td>`+[0,1].map(i=>{const k=key(r+'-'+i),v=st.v[k];return `<td id="c${r}${i}" class="${sel===r+'-'+i?'sel':''}" onclick="pick(${r},${i})">${v!=null?v+'<small> cm</small>':'<small>タッチ</small>'}</td>`}).join('')+'</tr>'});$('tb').innerHTML=h}
function pick(r,i){sel=r+'-'+i;buf='';$('disp').textContent='　';draw()}
const P=$('pad');['7','8','9','4','5','6','1','2','3','⌫','0','OK'].forEach(t=>{const b=document.createElement('button');b.textContent=t==='OK'?'✔ きろく':t;if(t==='OK')b.className='ok';if(t==='⌫')b.className='del';b.onclick=()=>press(t);P.appendChild(b)});
function press(t){if(!sel){$('disp').textContent='⬅ ます を タッチ';return}
if(t==='⌫')buf=buf.slice(0,-1);else if(t==='OK'){if(buf!==''){st.v[key(sel)]=+buf;save();const[r,i]=sel.split('-').map(Number);sel=r+'-'+(i<1?i+1:i);if(i===1&&r<conds().length-1)sel=(r+1)+'-0';buf='';$('disp').textContent='⭕ きろくした！';draw();return}}
else if(buf.length<3)buf+=t;$('disp').textContent=buf?buf+' cm':'　'}
function avg(r){const a=[0,1].map(i=>st.v[key(r+'-'+i)]).filter(v=>v!=null);return a.length?a.reduce((x,y)=>x+y,0)/a.length:null}
function show(){const c=conds(),av=c.map((x,r)=>avg(r));const m=Math.max(1,...av.map(v=>v||0));
$('graph').innerHTML='<div class="lbl">へいきんの きょり</div>'+c.map((x,r)=>av[r]==null?'':`<div class="bar" style="width:${Math.max(15,av[r]/m*100)}%;background:${x[1]}">${x[0]} ${Math.round(av[r])}cm</div>`).join('');
const ok=av.map((v,i)=>[v,i]).filter(x=>x[0]!=null);if(ok.length>=2){const b=ok.reduce((a,x)=>x[0]>a[0]?x:a);$('res').textContent='🏁 いちばん とおくへ いったのは「'+c[b[1]][0]+'」！'}else $('res').textContent=''}
function clearAll(){if(confirm('ぜんぶ けしますか？')){st.v={};save();sel=null;$('res').textContent='';$('graph').innerHTML='';draw()}}
function rename(){const n=prompt('アイデアの なまえ（れい：ゴムを ふやす）',st.idea);if(n){st.idea=n;save();draw()}}
$('mode').onchange=()=>{sel=null;draw()};$('name').oninput=()=>{sel=null;draw()};
if(location.hash==='#4')$('mode').value='4';draw();
</script></html>
